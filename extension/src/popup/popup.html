<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deutsch Lernen</title>
    <style>
      body { width: 300px; margin: 0; padding: 12px; font-family: system-ui, sans-serif; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: 14px 0 6px; }
      #status { font-size: 13px; color: #555; margin-bottom: 10px; word-break: break-all; }
      #actions { display: flex; flex-direction: column; gap: 6px; }
      .btn { padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
      .btn:hover { background: #f5f5f5; }
      hr { border: none; border-top: 1px solid #eee; margin: 12px 0 0; }
      .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 13px; }
      .set-row label { color: #333; }
      .slider-wrap { display: flex; align-items: center; gap: 8px; }
      .slider-wrap input[type="range"] { width: 110px; }
      .slider-val { font-size: 12px; color: #666; width: 34px; text-align: right; }
    </style>
  </head>
  <body>
    <h1>Deutsch Lernen</h1>
    <div id="status">…</div>
    <div id="actions"></div>
    <hr />
    <div id="settings"></div>
    <script src="popup.js"></script>
  </body>
</html>
